<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe — Arden Codes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             SETUP SCREEN
        ========================== -->

        <section class="setup-screen" id="setup-screen">

            <header>
                <p class="small-title">A LITTLE GAME</p>
                <h1>Tic Tac Toe</h1>
            </header>


            <div class="setup">

                <!-- Game Mode -->

                <div class="setting">

                    <span class="setting-label">
                        Choose game mode
                    </span>

                    <div class="selector">

                        <button class="option active" id="computer-mode-btn">
                            Computer
                        </button>

                        <button class="option" id="two-player-mode-btn">
                            2 Players
                        </button>

                    </div>

                </div>


                <!-- Player Symbol -->

                <div class="setting" id="symbol-setting">

                    <span class="setting-label">
                        Play as
                    </span>

                    <div class="selector">

                        <button class="option symbol-option active" id="choose-x">
                            X
                        </button>

                        <button class="option symbol-option" id="choose-o">
                            O
                        </button>

                    </div>

                </div>


                <!-- Start -->

                <button id="start-btn">
                    Start Game
                </button>

            </div>

        </section>


        <!-- =========================
             GAME SCREEN
        ========================== -->

        <section class="game-screen" id="game-screen" hidden>

            <header class="game-header">

                <p class="small-title">A LITTLE GAME</p>

                <h1>Tic Tac Toe</h1>

            </header>


            <!-- Players -->

            <section class="players">

                <div class="player active" id="playerX">

                    <span class="player-symbol">×</span>

                    <div class="player-info">
                        <span id="x-player-name">
                            Player 1
                        </span>

                        <strong id="xScore">
                            0
                        </strong>
                    </div>

                </div>


                <div class="divider"></div>


                <div class="player" id="playerO">

                    <span class="player-symbol">○</span>

                    <div class="player-info">
                        <span id="o-player-name">
                            Player 2
                        </span>

                        <strong id="oScore">
                            0
                        </strong>
                    </div>

                </div>

            </section>
            
            <!-- Turn -->

            <div class="turn">

                <p id="msg">
                    X's turn
                </p>

            </div>


            <!-- Board -->

            <section class="board">

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>

            </section>


            <!-- Controls -->

            <div class="bottom">

                <button id="reset-score-btn">
                    Reset score
                </button>

                <button id="new-game-btn">
                    New game
                </button>

            </div>


            <!-- Change Settings -->

            <button id="change-settings-btn" class="change-settings">
                Change settings
            </button>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="footer-left">

            <span>Made by</span>

            <a href="https://ardencodes.netlify.app/" target="_blank" rel="noopener noreferrer">

                <strong>Arden Codes</strong>

            </a>

        </div>


        <nav class="social-links">

            <a href="https://github.com/arden-codes" target="_blank" rel="noopener noreferrer">
                GitHub
            </a>

            <a href="https://www.instagram.com/arden.codes" target="_blank" rel="noopener noreferrer">
                Instagram
            </a>

            <a href="https://www.linkedin.com/in/arden-codes-367623431/" target="_blank" rel="noopener noreferrer">
                LinkedIn
            </a>

            <a href="https://x.com/ardencodes" target="_blank" rel="noopener noreferrer">
                X
            </a>

        </nav>

    </footer>


    <script src="script.js"></script>

</body>

</html>
